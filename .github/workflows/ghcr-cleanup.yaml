name: GHCR Cleanup

# Prunes the ci-<run_id> / dev-ci-<run_id> images that build.yaml and the
# release workflows push on every run. Release and :latest images share a
# digest with the ci- image they were promoted from and are always kept —
# see .github/scripts/ghcr-cleanup.sh for the exact rules.
#
# Needs secrets.GHCR_TOKEN to carry the read:packages and delete:packages
# scopes. Run it manually with dry_run first to review the plan.

on:
  schedule:
    - cron: '0 10 * * 0'  # Sunday 10:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be deleted'
        type: boolean
        default: true
      retention_days:
        description: 'Delete CI images older than this many days'
        type: number
        default: 7
  pull_request:
    branches: [ main ]
    paths:
      - .github/scripts/ghcr-cleanup.sh
      - .github/workflows/ghcr-cleanup.yaml
      - test/ghcr-cleanup-test.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # Exercise the keep/delete rules against fixtures before anything is deleted
  test:
    runs-on: ubuntu-latest
    name: Test Cleanup Rules
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Run cleanup rule tests
      run: make test-ghcr-cleanup

  cleanup:
    runs-on: ubuntu-latest
    name: Prune CI Images
    needs: test
    if: github.event_name != 'pull_request'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN }}
    - name: Prune stale CI image versions
      env:
        GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        OWNER: ${{ github.repository_owner }}
        # Scheduled runs delete for real; manual runs default to a dry run.
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        RETENTION_DAYS: ${{ inputs.retention_days || 7 }}
      run: |
        repo="${GITHUB_REPOSITORY#*/}"
        ./.github/scripts/ghcr-cleanup.sh \
          "${repo}" \
          "${repo}/ubuntu-dotfiles" \
          "${repo}/amazon-dotfiles"
